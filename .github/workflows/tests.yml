
name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["numpy"]
        include:
          # The oldest supported version of numpy
          - os: ubuntu-latest
            python-version: "3.10"
            numpy: "numpy==1.24.*"
    # Only the pinned-numpy job gets a suffix, since the names of the other
    # jobs are required status checks in the repository ruleset.
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}${{ matrix.numpy != 'numpy' && format(', {0}', matrix.numpy) || '' }} install and test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test] "${{ matrix.numpy }}"
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=colorsynth --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
