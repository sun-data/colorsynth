[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "colorsynth"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "A Python library for creating false-color images from arrays of spectral radiance"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>2",
    "numba",
    "astropy",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
]
doc = [
    "pytest",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "sphinx-favicon",
    "scipy",
    "astroscrappy",
]

[project.urls]
Homepage = "https://github.com/sun-data/colorsynth"
Documentation = "https://colorsynth.readthedocs.io/en/latest"

[tool.mypy]
packages = ["colorsynth"]

[[tool.mypy.overrides]]
# Neither of these ship a `py.typed` marker, so their types cannot be checked.
module = [
    "astropy.*",
    "numba.*",
]
ignore_missing_imports = true

[tool.setuptools_scm]

[tool.setuptools.package-data]
colorsynth = ["py.typed"]
